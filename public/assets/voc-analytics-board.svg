<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#F0EDEB"/>
  <!-- 柱状图深色线条 -->
  <line x1="80" y1="240" x2="80" y2="180" stroke="#141413" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="120" y1="240" x2="120" y2="150" stroke="#141413" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="160" y1="240" x2="160" y2="170" stroke="#D97757" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="240" x2="200" y2="120" stroke="#141413" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="240" y1="240" x2="240" y2="160" stroke="#141413" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="280" y1="240" x2="280" y2="140" stroke="#6F9A86" stroke-width="2.5" stroke-linecap="round"/>
