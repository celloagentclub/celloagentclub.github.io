<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#E9E1D5"/>
  <!-- 铺货产品卡片流（居中） -->
  <g stroke="#141413" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 产品卡片 1 -->
    <rect x="180" y="140" width="110" height="140" rx="6" />
    <rect x="195" y="160" width="80" height="60" rx="4" />
    <line x1="195" y1="240" x2="275" y2="240" stroke-width="2"/>
    <line x1="195" y1="255" x2="255" y2="255" stroke-width="2"/>
    <!-- 产品卡片 2 -->
    <rect x="320" y="140" width="110" height="140" rx="6" fill="#D97757" stroke="#D97757"/>
    <rect x="335" y="160" width="80" height="60" rx="4" />
    <line x1="335" y1="240" x2="415" y2="240" stroke-width="2"/>
    <line x1="335" y1="255" x2="395" y2="255" stroke-width="2"/>
    <!-- 产品卡片 3 -->
    <rect x="460" y="140" width="110" height="140" rx="6" />
    <rect x="475" y="160" width="80" height="60" rx="4" />
    <line x1="475" y1="240" x2="555" y2="240" stroke-width="2"/>
    <line x1="475" y1="255" x2="535" y2="255" stroke-width="2"/>
  </g>
  <!-- 活动标签/流水线（下方居中） -->
  <g stroke="#141413" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- 箭头流水线 -->
    <path d="M220 350 L300 350 L310 345 L300 355 Z" fill="#141413"/>
    <line x1="310" y1="350" x2="400" y2="350" />
    <path d="M400 350 L480 350 L490 345 L480 355 Z" fill="#141413"/>
    <line x1="490" y1="350" x2="580" y2="350" />
    <path d="M580 350 L660 350 L670 345 L660 355 Z" fill="#D97757"/>
    <!-- 补货标签 -->
    <rect x="200" y="380" width="80" height="30" rx="4" />
    <rect x="350" y="380" width="80" height="30" rx="4" />
    <rect x="500" y="380" width="80" height="30" rx="4" fill="#D97757" stroke="#D97757"/>
  </g>
</svg>
