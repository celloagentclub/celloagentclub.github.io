<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#E9E1D5"/>
  <!-- 多店铺矩阵网格 -->
  <g stroke="#141413" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 第一行店铺 -->
    <rect x="80" y="120" width="100" height="70" rx="6" />
    <rect x="200" y="120" width="100" height="70" rx="6" />
    <rect x="320" y="120" width="100" height="70" rx="6" />
    <rect x="440" y="120" width="100" height="70" rx="6" fill="#D97757" stroke="#D97757"/>
    <!-- 第二行店铺 -->
    <rect x="80" y="220" width="100" height="70" rx="6" />
    <rect x="200" y="220" width="100" height="70" rx="6" fill="#D97757" stroke="#D97757"/>
    <rect x="320" y="220" width="100" height="70" rx="6" />
    <rect x="440" y="220" width="100" height="70" rx="6" />
    <!-- 第三行店铺 -->
    <rect x="80" y="320" width="100" height="70" rx="6" />
    <rect x="200" y="320" width="100" height="70" rx="6" />
    <rect x="320" y="320" width="100" height="70" rx="6" />
    <rect x="440" y="320" width="100" height="70" rx="6" />
  </g>
  <!-- 运营看板（右侧） -->
  <g stroke="#141413" stroke-width="2.5" fill="none" stroke-linecap="round">
    <rect x="600" y="150" width="160" height="220" rx="8" />
    <!-- 折线图 -->
    <path d="M620 330 L640 300 L660 310 L680 270 L700 280 L720 240 L740 250" stroke-width="2.5"/>
    <!-- 门禁锁图标 -->
    <rect x="650" y="180" width="40" height="35" rx="4" />
    <path d="M658 180 L658 168 Q658 160 670 160 Q682 160 682 168 L682 180" />
    <!-- 小圆点 -->
    <circle cx="620" cy="200" r="4" fill="#D97757"/>
    <circle cx="620" cy="220" r="4" fill="#141413"/>
  </g>
  <!-- 连线：店铺 → 看板 -->
  <path d="M540 250 Q570 240 600 240" stroke="#141413" stroke-width="2" stroke-dasharray="6,6" fill="none"/>
</svg>
